name: financehub_mobile
description: FinanceHub personal finance app for Android and iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.3
  fl_chart: ^1.2.0
  file_picker: 10.3.10
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^12.0.2
  sqflite: ^2.4.2
  crypto: ^3.0.6
  pdf: 3.11.3
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
