{% extends 'base.html' %}
{% block title %}Sign In - FinanceHub{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-block">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 flex items-center justify-center mb-4 shadow-lg shadow-purple-500/50">
          <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
          </svg>
        </div>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">FinanceHub</h1>
      <p class="text-slate-400">Smart expense tracking for modern professionals</p>
    </div>

    <!-- Login Form -->
    <div class="card-hover bg-gradient-to-br from-slate-800 to-slate-700/50 border border-slate-700/50 rounded-2xl p-8 backdrop-blur-sm mb-6">
      <form method="POST" class="space-y-4">
        <!-- Username -->
        <div>
          <label class="block text-sm font-600 mb-2">Username</label>
          <input type="text" name="username" required placeholder="Enter your username"
            class="w-full px-4 py-3 rounded-lg bg-slate-700/50 border border-slate-600 text-white text-sm placeholder-slate-500 focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 focus:outline-none transition">
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-600 mb-2">Password</label>
          <input type="password" name="password" required placeholder="Enter your password"
            class="w-full px-4 py-3 rounded-lg bg-slate-700/50 border border-slate-600 text-white text-sm placeholder-slate-500 focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 focus:outline-none transition">
        </div>

        <!-- Remember Me -->
        <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
          <input type="checkbox" name="remember" class="w-4 h-4 rounded accent-purple-500">
          <span>Keep me signed in</span>
        </label>

        <!-- Sign In Button -->
        <button type="submit"
          class="w-full px-4 py-3 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-white font-600 hover:shadow-lg hover:shadow-purple-500/50 transition mt-6">
          Sign In
        </button>
      </form>
    </div>

    <!-- Sign Up Link -->
    <div class="text-center">
      <p class="text-slate-400 text-sm">
        Don't have an account?
        <a href="{{ url_for('register') }}" class="text-purple-400 hover:text-purple-300 font-600 transition">
          Create one now
        </a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
