{% extends 'base.html' %}
{% block title %}Edit Expense - FinanceHub{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="mb-7"><h1 class="text-3xl font-bold">Edit Expense</h1><p class="text-slate-400">Update this transaction.</p></div>
  <form method="POST" enctype="multipart/form-data" class="card p-7 space-y-5">
    <div><label class="block text-sm mb-2">Description</label><input class="field" name="title" required value="{{ expense.title }}"></div>
    <div><label class="block text-sm mb-2">Amount (₹)</label><input class="field" type="number" step="0.01" min="0.01" name="amount" required value="{{ expense.amount }}"></div>
    <div class="grid md:grid-cols-2 gap-5">
      <div><label class="block text-sm mb-2">Category</label><select class="field" name="category">{% for c in categories %}<option {% if c == expense.category %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div>
      <div><label class="block text-sm mb-2">Payment Method</label><select class="field" name="payment_method">{% for method in payment_methods %}<option {% if method == expense.payment_method %}selected{% endif %}>{{ method }}</option>{% endfor %}</select></div>
    </div>
    <div><label class="block text-sm mb-2">Date</label><input class="field" type="date" name="date" value="{{ expense.date }}"></div>
    <div><label class="block text-sm mb-2">Replace Receipt (optional)</label><input class="field" type="file" name="receipt" accept=".png,.jpg,.jpeg,.webp,.pdf">{% if expense.receipt_filename %}<a class="text-sm text-purple-300 mt-2 inline-block" target="_blank" href="{{ url_for('receipt_file', filename=expense.receipt_filename) }}">View current receipt</a>{% endif %}</div>
    <div><label class="block text-sm mb-2">Notes</label><textarea class="field" name="notes" rows="3">{{ expense.notes or '' }}</textarea></div>
    <div class="flex gap-3"><button class="btn-primary flex-1">Save Changes</button><a class="btn-secondary flex-1 text-center" href="{{ url_for('expenses') }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
